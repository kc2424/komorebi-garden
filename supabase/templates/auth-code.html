<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>確認コード</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f0;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#2c3e2c;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background-color:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:32px 28px;">
              <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#5a6b5a;">こもれび植物園</p>
              <h1 style="margin:0 0 24px;font-size:20px;font-weight:700;line-height:1.5;color:#2c3e2c;">確認コード</h1>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#3d4f3d;">
                こもれび植物園へのサインイン用の確認コードをお送りします。アプリに戻り、下のコードを入力してください。
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;">
                <tr>
                  <td align="center" style="padding:20px 16px;background-color:#eef4ea;border-radius:6px;border:1px solid #c8d9c0;">
                    <p style="margin:0 0 6px;font-size:12px;line-height:1.5;color:#5a6b5a;letter-spacing:0.05em;">確認コード</p>
                    <p style="margin:0;font-size:32px;font-weight:700;line-height:1.3;letter-spacing:0.2em;color:#2c5e2c;font-family:monospace;">{{ .Token }}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;line-height:1.7;color:#6b7b6b;">
                このメールに心当たりがない場合は、破棄していただいて問題ありません。
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
